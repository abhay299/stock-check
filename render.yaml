# Render Blueprint — provisions the FastAPI backend + a free Postgres for the watchlist.
# Use it via Render dashboard → New → Blueprint, pointed at this repo.
#
# Notes:
#  - rootDir=backend so Render builds/starts from the backend folder.
#  - DATABASE_URL is injected from the Postgres DB below; store.py switches to Postgres
#    when it's present (the free disk is ephemeral, so a SQLite file wouldn't survive).
#  - region/pythonVersion are easy to change in the dashboard if a value isn't available.
services:
  - type: web
    name: stock-check-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: stock-check-db
          property: connectionString

databases:
  - name: stock-check-db
    plan: free
    region: singapore
